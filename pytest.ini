[pytest]
# Exposes tools/imports_mcp as an importable top-level package during
# collection, so `pytest` run from the repo root (any invocation style)
# resolves `from imports_mcp... import ...` the same way `pytest tools/`
# already did by accident via tools/tests/__init__.py's absence of a
# sibling tools/__init__.py. Root-level placement is required: pytest's
# ini-file discovery only searches upward from the invoked path, so a
# tools/pytest.ini is silently ignored by a bare `pytest` run from here.
pythonpath = tools
